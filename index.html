<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PlayHub - Free Online Games</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Optional: Add Google AdSense script here once approved -->
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans selection:bg-indigo-500 selection:text-white">

  <!-- Top Navbar -->
  <header class="sticky top-0 z-30 bg-slate-900/90 backdrop-blur border-b border-slate-800">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between gap-4">
      <div class="flex items-center gap-2 cursor-pointer" onclick="closeGamePlayer()">
        <span class="text-2xl p-1.5 bg-indigo-600 rounded-xl">🎮</span>
        <span class="font-extrabold text-xl tracking-wider text-indigo-400">PLAYHUB</span>
      </div>

      <div class="flex items-center gap-3">
        <div class="bg-slate-800/80 border border-slate-700 px-3 py-1.5 rounded-xl flex items-center gap-2 text-sm font-bold text-amber-400">
          <span>🪙</span>
          <span id="coin-counter">0</span>
        </div>
        <button onclick="triggerRewardedAd()" class="bg-amber-500 hover:bg-amber-400 active:scale-95 text-slate-950 px-3.5 py-1.5 rounded-xl text-xs sm:text-sm font-bold shadow-lg shadow-amber-500/20 transition-all">
          🎁 Free Coins
        </button>
      </div>
    </div>
  </header>

  <!-- Main View (Catalog) -->
  <main id="catalog-view" class="max-w-7xl mx-auto px-4 py-6 flex-1 w-full space-y-6">
    
    <!-- Controls (Search + Categories) -->
    <div class="flex flex-col md:flex-row gap-4 justify-between items-center bg-slate-900/60 p-3.5 rounded-2xl border border-slate-800">
      <div id="category-container" class="flex gap-2 overflow-x-auto w-full md:w-auto pb-1 md:pb-0 no-scrollbar">
        <!-- Categories injected by JS -->
      </div>
      <input 
        type="text" 
        id="search-input" 
        placeholder="Search games..." 
        oninput="handleSearch(this.value)"
        class="w-full md:w-64 px-4 py-2 rounded-xl bg-slate-800 border border-slate-700 text-sm focus:outline-none focus:border-indigo-500"
      />
    </div>

    <!-- Poki-style Responsive Game Grid -->
    <div id="game-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4">
      <!-- Game cards injected by JS -->
    </div>
  </main>

  <!-- Game Player Screen (Hidden by default) -->
  <div id="player-view" class="hidden fixed inset-0 z-40 bg-slate-950 flex flex-col pt-16">
    <div class="max-w-6xl mx-auto w-full p-4 flex-1 flex flex-col space-y-3">
      <div class="flex justify-between items-center">
        <button onclick="closeGamePlayer()" class="text-sm font-semibold text-slate-400 hover:text-white flex items-center gap-2">
          ← Back to Catalog
        </button>
        <div class="flex items-center gap-2">
          <button onclick="triggerRewardedAd()" class="bg-amber-500 hover:bg-amber-400 text-slate-950 px-3 py-1.5 rounded-xl text-xs font-bold">
            🎁 Watch Ad for Hint/Coins
          </button>
          <button onclick="toggleFullscreen()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1.5 rounded-xl text-xs font-semibold">
            ⛶ Fullscreen
          </button>
        </div>
      </div>

      <!-- Iframe Container -->
      <div class="relative flex-1 w-full bg-black rounded-2xl overflow-hidden border border-slate-800 shadow-2xl">
        <iframe id="game-iframe" class="w-full h-full border-0" allowfullscreen allow="autoplay; gamepad"></iframe>
      </div>

      <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl flex justify-between items-center">
        <div>
          <h2 id="player-game-title" class="text-lg font-bold">Game Title</h2>
          <p id="player-game-category" class="text-xs text-indigo-400"></p>
        </div>
      </div>
    </div>
  </div>

  <!-- Simulated Rewarded Ad Modal -->
  <div id="ad-modal" class="hidden fixed inset-0 z-50 bg-black/90 backdrop-blur flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl max-w-sm w-full text-center space-y-4">
      <div class="text-3xl animate-bounce">📺</div>
      <h3 class="text-lg font-bold">Sponsor Ad Playing</h3>
      <p class="text-xs text-slate-400">Please watch for <span id="ad-timer" class="text-amber-400 font-bold">10</span> seconds to receive your reward.</p>
      <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden">
        <div id="ad-progress" class="bg-amber-500 h-full w-0 transition-all duration-1000"></div>
      </div>
    </div>
  </div>

  <script>
    // Game Catalog (100% Free Embeddable HTML5 Games from GameDistribution)
    const GAMES = [
      {
        id: "1",
        title: "Subway Runner",
        category: "Action",
        thumbnail: "https://img.gamedistribution.com/68eeecfb220641bf8f6b4904c6e94e43-512x512.jpeg",
        embedUrl: "https://html5.gamedistribution.com/68eeecfb220641bf8f6b4904c6e94e43/"
      },
      {
        id: "2",
        title: "Moto X3M Bike Race",
        category: "Racing",
        thumbnail: "https://img.gamedistribution.com/72a44ae9c4904bc59be2ce8ae00d95d1-512x512.jpeg",
        embedUrl: "https://html5.gamedistribution.com/72a44ae9c4904bc59be2ce8ae00d95d1/"
      },
      {
        id: "3",
        title: "Jewel Block Puzzle",
        category: "Puzzle",
        thumbnail: "https://img.gamedistribution.com/8c7f9df012574fa09228e93ba9f0d0cb-512x512.jpeg",
        embedUrl: "https://html5.gamedistribution.com/8c7f9df012574fa09228e93ba9f0d0cb/"
      },
      {
        id: "4",
        title: "Bubble Shooter Pro",
        category: "Casual",
        thumbnail: "https://img.gamedistribution.com/a933f7d45c5a4d3ca8ecb2f0a1dbe2aa-512x512.jpeg",
        embedUrl: "https://html5.gamedistribution.com/a933f7d45c5a4d3ca8ecb2f0a1dbe2aa/"
      },
      {
        id: "5",
        title: "Highway Racer 3D",
        category: "Racing",
        thumbnail: "https://img.gamedistribution.com/13f0402b4d9a4055b85e054cf5319985-512x512.jpeg",
        embedUrl: "https://html5.gamedistribution.com/13f0402b4d9a4055b85e054cf5319985/"
      },
      {
        id: "6",
        title: "Archery Master",
        category: "Sports",
        thumbnail: "https://img.gamedistribution.com/e5f375c3dbb945cbb6db582d95221ca9-512x512.jpeg",
        embedUrl: "https://html5.gamedistribution.com/e5f375c3dbb945cbb6db582d95221ca9/"
      }
    ];

    let currentCategory = "All";
    let currentSearch = "";
    let coins = parseInt(localStorage.getItem("coins") || "0");
    document.getElementById("coin-counter").innerText = coins;

    // Render Categories
    const categories = ["All", ...new Set(GAMES.map(g => g.category))];
    const categoryContainer = document.getElementById("category-container");
    categoryContainer.innerHTML = categories.map(cat => `
      <button onclick="setCategory('${cat}')" id="cat-btn-${cat}" class="px-4 py-1.5 rounded-xl text-xs sm:text-sm font-semibold transition-colors shrink-0 ${cat === 'All' ? 'bg-indigo-600 text-white' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}">
        ${cat}
      </button>
    `).join("");

    // Render Game Cards
    function renderGames() {
      const grid = document.getElementById("game-grid");
      const filtered = GAMES.filter(g => {
        const matchesCategory = currentCategory === "All" || g.category === currentCategory;
        const matchesSearch = g.title.toLowerCase().includes(currentSearch.toLowerCase());
        return matchesCategory && matchesSearch;
      });

      grid.innerHTML = filtered.map(game => `
        <div onclick="openGame('${game.id}')" class="group cursor-pointer flex flex-col rounded-2xl overflow-hidden bg-slate-900 border border-slate-800 hover:border-indigo-500/50 hover:shadow-xl hover:shadow-indigo-500/10 transition-all duration-200 transform hover:-translate-y-1">
          <div class="relative w-full aspect-square bg-slate-800 overflow-hidden">
            <img src="${game.thumbnail}" alt="${game.title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" loading="lazy" />
            <span class="absolute top-2 left-2 px-2 py-0.5 rounded-full text-[10px] font-bold bg-slate-900/80 backdrop-blur border border-slate-700 text-slate-200">
              ${game.category}
            </span>
          </div>
          <div class="p-3">
            <h3 class="font-bold text-sm text-slate-100 truncate group-hover:text-indigo-400">${game.title}</h3>
          </div>
        </div>
      `).join("");
    }

    function setCategory(cat) {
      currentCategory = cat;
      categories.forEach(c => {
        const btn = document.getElementById(`cat-btn-${c}`);
        if (c === cat) {
          btn.className = "px-4 py-1.5 rounded-xl text-xs sm:text-sm font-semibold bg-indigo-600 text-white shrink-0";
        } else {
          btn.className = "px-4 py-1.5 rounded-xl text-xs sm:text-sm font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700 shrink-0";
        }
      });
      renderGames();
    }

    function handleSearch(query) {
      currentSearch = query;
      renderGames();
    }

    function openGame(gameId) {
      const game = GAMES.find(g => g.id === gameId);
      if (!game) return;
      document.getElementById("game-iframe").src = game.embedUrl;
      document.getElementById("player-game-title").innerText = game.title;
      document.getElementById("player-game-category").innerText = game.category;
      document.getElementById("player-view").classList.remove("hidden");
    }

    function closeGamePlayer() {
      document.getElementById("game-iframe").src = "";
      document.getElementById("player-view").classList.add("hidden");
    }

    function toggleFullscreen() {
      const iframe = document.getElementById("game-iframe");
      if (document.fullscreenElement) {
        document.exitFullscreen();
      } else {
        iframe.requestFullscreen();
      }
    }

    // Rewarded Video Ad Logic
    function triggerRewardedAd() {
      const adModal = document.getElementById("ad-modal");
      const timerEl = document.getElementById("ad-timer");
      const progressEl = document.getElementById("ad-progress");
      
      adModal.classList.remove("hidden");
      let timeLeft = 10;
      timerEl.innerText = timeLeft;
      progressEl.style.width = "0%";

      const interval = setInterval(() => {
        timeLeft--;
        timerEl.innerText = timeLeft;
        progressEl.style.width = `${((10 - timeLeft) / 10) * 100}%`;

        if (timeLeft <= 0) {
          clearInterval(interval);
          adModal.classList.add("hidden");
          coins += 100;
          localStorage.setItem("coins", coins.toString());
          document.getElementById("coin-counter").innerText = coins;
          alert("🎉 Reward Earned! +100 Coins added to your account.");
        }
      }, 1000);
    }

    // Initial Render
    renderGames();
  </script>
</body>
</html>
