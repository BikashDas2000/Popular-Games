<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PlayHub - Free Online Games | Play Trending Games</title>
  <meta name="description" content="Play free online games like Subway Surfers, 2048, Tetris, Pac-Man, and more on PlayHub." />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Fredoka', sans-serif;
      background: radial-gradient(circle at 50% 20%, #7bf5ea 0%, #2bd5ca 50%, #00b4d8 100%);
      background-attachment: fixed;
    }
    .poki-card {
      transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.15s ease;
    }
    .poki-card:hover {
      transform: scale(1.04) translateY(-3px);
    }
    .poki-card:active {
      transform: scale(0.96);
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="min-h-screen flex flex-col text-slate-900 selection:bg-indigo-500 selection:text-white pb-12">

  <!-- Main View -->
  <main id="catalog-view" class="max-w-4xl mx-auto px-4 py-4 w-full space-y-4">
    
    <!-- Poki Masonry Grid -->
    <div id="games-container" class="grid grid-cols-4 sm:grid-cols-4 md:grid-cols-5 gap-3 auto-rows-[80px] sm:auto-rows-[100px] md:auto-rows-[120px]">
      
      <!-- Logo Box -->
      <div class="bg-white rounded-3xl p-3 flex flex-col justify-between shadow-lg shadow-teal-900/10 border-2 border-white/60">
        <div class="flex items-center gap-1 font-black text-xl sm:text-2xl tracking-tighter text-blue-600">
          <span>play</span><span class="text-teal-500 text-xs">●</span>
        </div>
        <div class="flex justify-between items-center text-slate-400">
          <button class="p-1 hover:text-blue-600">🎮</button>
          <button class="p-1 hover:text-blue-600">🔥</button>
        </div>
      </div>

      <!-- Games will be auto-generated here -->
    </div>
  </main>

  <!-- Game Player Screen -->
  <div id="player-view" class="hidden fixed inset-0 z-50 bg-black/90 backdrop-blur flex flex-col items-center justify-center p-2 sm:p-4">
    <div class="w-full max-w-5xl h-full max-h-[95vh] bg-slate-900 rounded-3xl overflow-hidden flex flex-col border border-slate-700 shadow-2xl">
      <!-- Player Header -->
      <div class="h-14 bg-slate-800/90 px-4 flex items-center justify-between border-b border-slate-700">
        <button onclick="closeGamePlayer()" class="bg-slate-700 hover:bg-slate-600 text-white font-bold text-xs sm:text-sm px-3.5 py-1.5 rounded-xl transition-all flex items-center gap-1">
          ✕ Close
        </button>
        <span id="player-game-title" class="font-bold text-white text-base">Game</span>
        <button onclick="toggleFullscreen()" class="bg-slate-700 hover:bg-slate-600 text-white font-semibold text-xs px-3 py-1.5 rounded-xl">
          ⛶ Fullscreen
        </button>
      </div>

      <!-- Iframe -->
      <div class="flex-1 w-full bg-black relative">
        <iframe id="game-iframe" class="w-full h-full border-0" allow="autoplay; gamepad" allowfullscreen></iframe>
      </div>
    </div>
  </div>

  <script>
    const GAMES_LIST = [
      { id: "1", title: "2048 Classic", big: true, img: "https://images.unsplash.com/photo-1611996575749-79a3a250f948?w=600", url: "https://play2048.co/" },
      { id: "2", title: "Hextris", big: false, img: "https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=400", url: "https://hextris.io/" },
      { id: "3", title: "Tower Builder", big: false, img: "https://images.unsplash.com/photo-1542751371-adc38448a05e?w=400", url: "https://iamkun.github.io/tower_game/" },
      { id: "4", title: "Pac-Man", big: false, img: "https://images.unsplash.com/photo-1558981806-ec527fa84c39?w=400", url: "https://freepacman.org/" },
      { id: "5", title: "Tetris Block", big: true, img: "https://images.unsplash.com/photo-1529699211952-734e80c4d42b?w=600", url: "https://tetris.com/play-tetris" },
      { id: "6", title: "Flappy Bird", big: false, img: "https://images.unsplash.com/photo-1511512578047-dfb367046420?w=400", url: "https://flappybird.io/" },
      { id: "7", title: "Dino T-Rex", big: false, img: "https://images.unsplash.com/photo-1534447677768-be436bb09401?w=400", url: "https://chromedino.com/" },
      { id: "8", title: "Snake", big: false, img: "https://images.unsplash.com/photo-1579373903781-fd5c0c30c4cd?w=400", url: "https://playsnake.org/" },
      { id: "9", title: "Wordle", big: false, img: "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=400", url: "https://wordleunlimited.org/" },
      { id: "10", title: "Cookie Clicker", big: false, img: "https://images.unsplash.com/photo-1558961363-fa8fdf82db35?w=400", url: "https://orteil.dashnet.org/cookieclicker/" },
      { id: "11", title: "Subway Surf", big: true, img: "https://images.unsplash.com/photo-1563089145-599997674d42?w=600", url: "https://subwaysurfers.online/" },
      { id: "12", title: "Chess Online", big: false, img: "https://images.unsplash.com/photo-1586165368502-1bad197a6461?w=400", url: "https://lichess.org/tv/frame?theme=brown&bg=dark" }
    ];

    const container = document.getElementById("games-container");

    GAMES_LIST.forEach(game => {
      const card = document.createElement("div");
      card.onclick = () => openGame(game.id);
      card.className = `poki-card ${game.big ? 'col-span-2 row-span-2' : ''} rounded-3xl overflow-hidden shadow-md shadow-teal-950/15 cursor-pointer relative border-2 border-white/80 bg-slate-800`;
      card.innerHTML = `
        <img src="${game.img}" alt="${game.title}" class="w-full h-full object-cover" />
        ${game.big ? `<div class="absolute bottom-2 left-3 bg-black/60 backdrop-blur-md px-3 py-1 rounded-xl text-white font-bold text-xs sm:text-sm">${game.title}</div>` : ''}
      `;
      container.appendChild(card);
    });

    function openGame(id) {
      const game = GAMES_LIST.find(g => g.id === id);
      if (!game) return;
      document.getElementById("game-iframe").src = game.url;
      document.getElementById("player-game-title").innerText = game.title;
      document.getElementById("player-view").classList.remove("hidden");
    }

    function closeGamePlayer() {
      document.getElementById("game-iframe").src = "";
      document.getElementById("player-view").classList.add("hidden");
    }

    function toggleFullscreen() {
      const iframe = document.getElementById("game-iframe");
      if (document.fullscreenElement) {
        document.exitFullscreen();
      } else {
        iframe.requestFullscreen();
      }
    }
  </script>
</body>
</html>
