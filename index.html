<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PlayHub - Play Free Online Games</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Fredoka', sans-serif;
      background: radial-gradient(circle at 50% 20%, #7bf5ea 0%, #2bd5ca 50%, #00b4d8 100%);
      background-attachment: fixed;
    }
    .poki-card {
      transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.15s ease;
    }
    .poki-card:hover {
      transform: scale(1.04) translateY(-3px);
    }
    .poki-card:active {
      transform: scale(0.96);
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="min-h-screen flex flex-col text-slate-900 selection:bg-indigo-500 selection:text-white pb-12">

  <!-- Main View -->
  <main id="catalog-view" class="max-w-4xl mx-auto px-4 py-4 w-full space-y-4">
    
    <!-- Poki Masonry Style Grid -->
    <div class="grid grid-cols-4 sm:grid-cols-4 md:grid-cols-5 gap-3 auto-rows-[80px] sm:auto-rows-[100px] md:auto-rows-[120px]">
      
      <!-- Brand Box -->
      <div class="bg-white rounded-3xl p-3 flex flex-col justify-between shadow-lg shadow-teal-900/10 border-2 border-white/60">
        <div class="flex items-center gap-1 font-black text-2xl tracking-tighter text-blue-600">
          <span>poki</span><span class="text-teal-500 text-xs">●</span>
        </div>
        <div class="flex justify-between items-center text-slate-400">
          <button class="p-1 hover:text-blue-600 transition-colors">👤</button>
          <button class="p-1 hover:text-blue-600 transition-colors">🔍</button>
        </div>
      </div>

      <!-- Featured Big 2x2 Game (2048) -->
      <div onclick="openGame('1')" class="poki-card col-span-2 row-span-2 rounded-3xl overflow-hidden shadow-xl shadow-teal-950/20 cursor-pointer relative bg-amber-400 border-2 border-white/80">
        <img src="https://images.unsplash.com/photo-1611996575749-79a3a250f948?w=800&auto=format&fit=crop&q=80" alt="2048" class="w-full h-full object-cover" />
        <div class="absolute bottom-2 left-3 bg-black/60 backdrop-blur-md px-3 py-1 rounded-xl text-white font-bold text-xs sm:text-sm">
          2048 Classic
        </div>
      </div>

      <!-- Normal Card: Hextris -->
      <div onclick="openGame('2')" class="poki-card rounded-3xl overflow-hidden shadow-md shadow-teal-950/15 cursor-pointer relative bg-indigo-500 border-2 border-white/80">
        <img src="https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=400&auto=format&fit=crop&q=80" alt="Hextris" class="w-full h-full object-cover" />
      </div>

      <!-- Normal Card: Tower Building -->
      <div onclick="openGame('3')" class="poki-card rounded-3xl overflow-hidden shadow-md shadow-teal-950/15 cursor-pointer relative bg-sky-400 border-2 border-white/80">
        <img src="https://images.unsplash.com/photo-1542751371-adc38448a05e?w=400&auto=format&fit=crop&q=80" alt="Tower" class="w-full h-full object-cover" />
      </div>

      <!-- Normal Card: Pacman -->
      <div onclick="openGame('4')" class="poki-card rounded-3xl overflow-hidden shadow-md shadow-teal-950/15 cursor-pointer relative bg-yellow-400 border-2 border-white/80">
        <img src="https://images.unsplash.com/photo-1558981806-ec527fa84c39?w=400&auto=format&fit=crop&q=80" alt="Pacman" class="w-full h-full object-cover" />
      </div>

      <!-- Featured Big 2x2 Game (Tetris) -->
      <div onclick="openGame('5')" class="poki-card col-span-2 row-span-2 rounded-3xl overflow-hidden shadow-xl shadow-teal-950/20 cursor-pointer relative bg-emerald-500 border-2 border-white/80">
        <img src="https://images.unsplash.com/photo-1529699211952-734e80c4d42b?w=800&auto=format&fit=crop&q=80" alt="Tetris" class="w-full h-full object-cover" />
        <div class="absolute bottom-2 left-3 bg-black/60 backdrop-blur-md px-3 py-1 rounded-xl text-white font-bold text-xs sm:text-sm">
          Tetris Block
        </div>
      </div>

      <!-- Normal Card: Flappy Bird -->
      <div onclick="openGame('6')" class="poki-card rounded-3xl overflow-hidden shadow-md shadow-teal-950/15 cursor-pointer relative bg-rose-400 border-2 border-white/80">
        <img src="https://images.unsplash.com/photo-1511512578047-dfb367046420?w=400&auto=format&fit=crop&q=80" alt="Flappy Bird" class="w-full h-full object-cover" />
      </div>

      <!-- Reward Coins Box -->
      <div onclick="showRealAd()" class="poki-card rounded-3xl bg-amber-400 p-2 flex flex-col justify-center items-center text-center cursor-pointer border-2 border-white/80 shadow-md shadow-amber-900/20">
        <span class="text-2xl animate-bounce">🎁</span>
        <span class="font-bold text-[11px] text-amber-950 leading-tight">Free Coins</span>
      </div>

      <!-- Normal Card: Chrome Dino -->
      <div onclick="openGame('7')" class="poki-card rounded-3xl overflow-hidden shadow-md shadow-teal-950/15 cursor-pointer relative bg-stone-300 border-2 border-white/80">
        <img src="https://images.unsplash.com/photo-1534447677768-be436bb09401?w=400&auto=format&fit=crop&q=80" alt="Dino Runner" class="w-full h-full object-cover" />
      </div>

      <!-- Normal Card: Slither -->
      <div onclick="openGame('8')" class="poki-card rounded-3xl overflow-hidden shadow-md shadow-teal-950/15 cursor-pointer relative bg-purple-500 border-2 border-white/80">
        <img src="https://images.unsplash.com/photo-1579373903781-fd5c0c30c4cd?w=400&auto=format&fit=crop&q=80" alt="Snake" class="w-full h-full object-cover" />
      </div>

    </div>
  </main>

  <!-- Game Player Screen (Modal) -->
  <div id="player-view" class="hidden fixed inset-0 z-50 bg-black/90 backdrop-blur flex flex-col items-center justify-center p-2 sm:p-4">
    <div class="w-full max-w-5xl h-full max-h-[95vh] bg-slate-900 rounded-3xl overflow-hidden flex flex-col border border-slate-700 shadow-2xl">
      <!-- Player Header -->
      <div class="h-14 bg-slate-800/90 px-4 flex items-center justify-between border-b border-slate-700">
        <button onclick="closeGamePlayer()" class="bg-slate-700 hover:bg-slate-600 text-white font-bold text-xs sm:text-sm px-3.5 py-1.5 rounded-xl transition-all flex items-center gap-1">
          ✕ Close
        </button>
        <span id="player-game-title" class="font-bold text-white text-base">Game</span>
        <div class="flex items-center gap-2">
          <button onclick="showRealAd()" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-xs px-3 py-1.5 rounded-xl">
            🎁 Watch Ad (+100)
          </button>
          <button onclick="toggleFullscreen()" class="bg-slate-700 hover:bg-slate-600 text-white font-semibold text-xs px-3 py-1.5 rounded-xl">
            ⛶
          </button>
        </div>
      </div>

      <!-- Iframe -->
      <div class="flex-1 w-full bg-black relative">
        <iframe id="game-iframe" class="w-full h-full border-0" allow="autoplay; gamepad" allowfullscreen></iframe>
      </div>
    </div>
  </div>

  <script>
    const GAMES = {
      "1": { title: "2048 Classic", url: "https://play2048.co/" },
      "2": { title: "Hextris Arcade", url: "https://hextris.io/" },
      "3": { title: "Tower Building", url: "https://iamkun.github.io/tower_game/" },
      "4": { title: "Pacman Classic", url: "https://freepacman.org/" },
      "5": { title: "Tetris Game", url: "https://tetris.com/play-tetris" },
      "6": { title: "Flappy Bird", url: "https://flappybird.io/" },
      "7": { title: "Dino Runner", url: "https://chromedino.com/" },
      "8": { title: "Snake Classic", url: "https://playsnake.org/" }
    };

    let coins = parseInt(localStorage.getItem("coins") || "0");

    function openGame(id) {
      const game = GAMES[id];
      if (!game) return;
      document.getElementById("game-iframe").src = game.url;
      document.getElementById("player-game-title").innerText = game.title;
      document.getElementById("player-view").classList.remove("hidden");
    }

    function closeGamePlayer() {
      document.getElementById("game-iframe").src = "";
      document.getElementById("player-view").classList.add("hidden");
    }

    function toggleFullscreen() {
      const iframe = document.getElementById("game-iframe");
      if (document.fullscreenElement) {
        document.exitFullscreen();
      } else {
        iframe.requestFullscreen();
      }
    }

    function showRealAd() {
      coins += 100;
      localStorage.setItem("coins", coins.toString());
      alert("🎉 +100 Coins received!");
    }
  </script>
</body>
</html>
